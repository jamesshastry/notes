<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Smart Notes App</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .main-content {
            padding: 30px;
        }
        
        .search-bar {
            margin-bottom: 30px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 1rem;
            background: white;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #6c757d;
            border: 2px solid #e9ecef;
        }
        
        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(81, 207, 102, 0.4);
        }
        
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .note-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }
        
        .note-card.editing {
            border-color: #51cf66;
            background: linear-gradient(135deg, rgba(81, 207, 102, 0.05) 0%, rgba(64, 192, 87, 0.05) 100%);
        }
        
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .note-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
            word-break: break-word;
        }
        
        .note-date {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 10px;
        }
        
        .note-content {
            color: #495057;
            line-height: 1.6;
            margin-bottom: 15px;
            word-break: break-word;
        }
        
        .note-actions {
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .note-card:hover .note-actions {
            opacity: 1;
        }
        
        .btn-small {
            padding: 8px 12px;
            font-size: 0.9rem;
            border-radius: 15px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6c757d;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: #f8f9fa;
            color: #495057;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #495057;
        }
        
        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            flex: 1;
            min-width: 150px;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-tab {
            padding: 8px 16px;
            border: 2px solid #e1e5e9;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .filter-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .filter-tab:hover {
            border-color: #667eea;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .notes-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                justify-content: center;
            }
            
            .modal-content {
                width: 95%;
                padding: 20px;
            }
            
            .stats {
                flex-direction: column;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Smart Notes App</h1>
            <p>Organize your thoughts, ideas, and memories in one place</p>
            <div id="statusIndicator" style="margin-top: 10px; font-size: 0.9rem; opacity: 0.8;">
                🔄 Checking connection...
            </div>
        </div>
        
        <div class="main-content">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalNotes">0</div>
                    <div class="stat-label">Total Notes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="recentNotes">0</div>
                    <div class="stat-label">This Week</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalWords">0</div>
                    <div class="stat-label">Total Words</div>
                </div>
            </div>
            
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search your notes...">
            </div>
            
            <div class="filter-tabs">
                <div class="filter-tab active" data-filter="all">All Notes</div>
                <div class="filter-tab" data-filter="recent">Recent</div>
                <div class="filter-tab" data-filter="favorites">Favorites</div>
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" onclick="openCreateModal()">
                    ➕ Create New Note
                </button>
                <button class="btn btn-secondary" onclick="exportNotes()">
                    📤 Export Notes
                </button>
                <button class="btn btn-secondary" onclick="importNotes()">
                    📥 Import Notes
                </button>
                <button class="btn btn-danger" onclick="clearAllNotes()">
                    🗑️ Clear All
                </button>
            </div>
            
            <div class="notes-grid" id="notesGrid">
                <!-- Notes will be dynamically inserted here -->
            </div>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">📝</div>
                <h3>No notes found</h3>
                <p>Start by creating your first note!</p>
                <button class="btn btn-primary" onclick="openCreateModal()">
                    ➕ Create Your First Note
                </button>
            </div>
        </div>
    </div>
    
    <!-- Create/Edit Note Modal -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Create New Note</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="noteForm">
                <div class="form-group">
                    <label class="form-label" for="noteTitle">Title</label>
                    <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title..." required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="noteContent">Content</label>
                    <textarea class="form-input form-textarea" id="noteContent" placeholder="Write your note content here..." required></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Note</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Hidden file input for import -->
    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="handleFileImport(event)">
    
    <!-- Supabase Configuration -->
    <script>
        // Supabase Configuration - reads from environment variables
        const SUPABASE_URL = 'https://your-project-id.supabase.co'; // Replace with your actual URL
        const SUPABASE_ANON_KEY = 'your-anon-key-here'; // Replace with your actual key
        
        // For production, these will be injected by the server
        // You can also set them via environment variables in Render
        
        // Initialize Supabase client
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    
    <script>
        class NotesApp {
            constructor() {
                this.notes = [];
                this.currentFilter = 'all';
                this.editingNoteId = null;
                this.user = null;
                this.init();
            }
            
            async init() {
                await this.checkAuth();
                await this.loadNotes();
                this.renderNotes();
                this.updateStats();
                this.bindEvents();
                this.updateStatusIndicator();
            }
            
            async checkAuth() {
                try {
                    console.log('🔧 Checking Supabase connection...');
                    console.log('🔗 Supabase URL:', SUPABASE_URL);
                    console.log('🔑 Supabase Key:', SUPABASE_ANON_KEY ? 'Set' : 'Not set');
                    
                    const { data: { user }, error } = await supabaseClient.auth.getUser();
                    if (error) throw error;
                    
                    if (user) {
                        this.user = user;
                        console.log('✅ User authenticated:', user.email);
                    } else {
                        // For demo purposes, we'll use a guest user
                        // In production, you'd redirect to login
                        console.log('⚠️ No user authenticated, using guest mode');
                        this.user = { id: 'guest-user-id' };
                    }
                } catch (error) {
                    console.error('❌ Auth error:', error);
                    console.log('🔄 Falling back to guest mode');
                    // Fallback to guest mode
                    this.user = { id: 'guest-user-id' };
                }
            }
            
            bindEvents() {
                // Search functionality
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchNotes(e.target.value);
                });
                
                // Filter tabs
                document.querySelectorAll('.filter-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });
                
                // Form submission
                document.getElementById('noteForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveNote();
                });
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'n': e.preventDefault(); this.openCreateModal(); break;
                            case 'f': e.preventDefault(); document.getElementById('searchInput').focus(); break;
                        }
                    }
                    if (e.key === 'Escape') {
                        this.closeModal();
                    }
                });
            }
            
            async loadNotes() {
                try {
                    console.log('📚 Loading notes for user:', this.user.id);
                    
                    // Check if Supabase is properly configured
                    if (!SUPABASE_URL || SUPABASE_URL.includes('your-project-id')) {
                        console.warn('⚠️ Supabase not configured, using localStorage fallback');
                        this.useLocalStorage = true;
                        this.loadNotesFromLocalStorage();
                        this.updateStatusIndicator();
                        return;
                    }
                    
                    const { data, error } = await supabaseClient
                        .from('notes')
                        .select('*')
                        .eq('user_id', this.user.id)
                        .order('created_at', { ascending: false });
                    
                    if (error) {
                        console.error('❌ Supabase error:', error);
                        console.log('🔄 Falling back to localStorage');
                        this.useLocalStorage = true;
                        this.loadNotesFromLocalStorage();
                        this.updateStatusIndicator();
                        return;
                    }
                    
                    this.notes = data || [];
                    console.log('✅ Notes loaded from Supabase:', this.notes.length);
                } catch (error) {
                    console.error('❌ Error loading notes:', error);
                    console.log('🔄 Falling back to localStorage');
                    this.useLocalStorage = true;
                    this.loadNotesFromLocalStorage();
                    this.updateStatusIndicator();
                }
            }
            
            loadNotesFromLocalStorage() {
                const saved = localStorage.getItem('smartNotes');
                this.notes = saved ? JSON.parse(saved) : [];
                console.log('📱 Notes loaded from localStorage:', this.notes.length);
            }
            
            async saveNotes() {
                // This method is now handled by individual CRUD operations
                this.updateStats();
            }
            
            async createNote(title, content) {
                try {
                    // Check if we should use localStorage fallback
                    if (this.useLocalStorage || !SUPABASE_URL || SUPABASE_URL.includes('your-project-id')) {
                        console.log('📱 Creating note in localStorage');
                        return this.createNoteInLocalStorage(title, content);
                    }
                    
                    console.log('🗄️ Creating note in Supabase');
                    const { data, error } = await supabaseClient
                        .from('notes')
                        .insert([
                            {
                                title: title.trim(),
                                content: content.trim(),
                                user_id: this.user.id,
                                is_favorite: false,
                                tags: []
                            }
                        ])
                        .select()
                        .single();
                    
                    if (error) {
                        console.error('❌ Supabase error:', error);
                        console.log('🔄 Falling back to localStorage');
                        this.useLocalStorage = true;
                        return this.createNoteInLocalStorage(title, content);
                    }
                    
                    this.notes.unshift(data);
                    this.updateStats();
                    console.log('✅ Note created in Supabase');
                    return data;
                } catch (error) {
                    console.error('❌ Error creating note:', error);
                    console.log('🔄 Falling back to localStorage');
                    this.useLocalStorage = true;
                    return this.createNoteInLocalStorage(title, content);
                }
            }
            
            createNoteInLocalStorage(title, content) {
                const note = {
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                    title: title.trim(),
                    content: content.trim(),
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    is_favorite: false,
                    tags: []
                };
                
                this.notes.unshift(note);
                localStorage.setItem('smartNotes', JSON.stringify(this.notes));
                this.updateStats();
                console.log('✅ Note created in localStorage');
                return note;
            }
            
            async updateNote(id, title, content) {
                try {
                    if (this.useLocalStorage) {
                        return this.updateNoteInLocalStorage(id, title, content);
                    }
                    
                    const { data, error } = await supabaseClient
                        .from('notes')
                        .update({
                            title: title.trim(),
                            content: content.trim()
                        })
                        .eq('id', id)
                        .eq('user_id', this.user.id)
                        .select()
                        .single();
                    
                    if (error) throw error;
                    
                    const noteIndex = this.notes.findIndex(note => note.id === id);
                    if (noteIndex !== -1) {
                        this.notes[noteIndex] = data;
                    }
                    
                    this.updateStats();
                    return data;
                } catch (error) {
                    console.error('Error updating note:', error);
                    this.useLocalStorage = true;
                    return this.updateNoteInLocalStorage(id, title, content);
                }
            }
            
            updateNoteInLocalStorage(id, title, content) {
                const noteIndex = this.notes.findIndex(note => note.id === id);
                if (noteIndex !== -1) {
                    this.notes[noteIndex].title = title.trim();
                    this.notes[noteIndex].content = content.trim();
                    this.notes[noteIndex].updated_at = new Date().toISOString();
                    localStorage.setItem('smartNotes', JSON.stringify(this.notes));
                    this.updateStats();
                    return this.notes[noteIndex];
                }
                return null;
            }
            
            async deleteNote(id) {
                try {
                    if (this.useLocalStorage) {
                        this.deleteNoteInLocalStorage(id);
                        return;
                    }
                    
                    const { error } = await supabaseClient
                        .from('notes')
                        .delete()
                        .eq('id', id)
                        .eq('user_id', this.user.id);
                    
                    if (error) throw error;
                    
                    this.notes = this.notes.filter(note => note.id !== id);
                    this.updateStats();
                } catch (error) {
                    console.error('Error deleting note:', error);
                    this.useLocalStorage = true;
                    this.deleteNoteInLocalStorage(id);
                }
            }
            
            deleteNoteInLocalStorage(id) {
                this.notes = this.notes.filter(note => note.id !== id);
                localStorage.setItem('smartNotes', JSON.stringify(this.notes));
                this.updateStats();
            }
            
            async toggleFavorite(id) {
                try {
                    const note = this.notes.find(note => note.id === id);
                    if (!note) return;
                    
                    const { data, error } = await supabaseClient
                        .from('notes')
                        .update({ is_favorite: !note.is_favorite })
                        .eq('id', id)
                        .eq('user_id', this.user.id)
                        .select()
                        .single();
                    
                    if (error) throw error;
                    
                    const noteIndex = this.notes.findIndex(note => note.id === id);
                    if (noteIndex !== -1) {
                        this.notes[noteIndex] = data;
                    }
                    
                    this.updateStats();
                } catch (error) {
                    console.error('Error toggling favorite:', error);
                    alert('Failed to update favorite status. Please try again.');
                }
            }
            
            searchNotes(query) {
                const filteredNotes = this.notes.filter(note => 
                    note.title.toLowerCase().includes(query.toLowerCase()) ||
                    note.content.toLowerCase().includes(query.toLowerCase())
                );
                this.renderNotes(filteredNotes);
            }
            
            setFilter(filter) {
                this.currentFilter = filter;
                
                // Update active tab
                document.querySelectorAll('.filter-tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
                
                this.renderNotes();
            }
            
            getFilteredNotes() {
                const now = new Date();
                const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                
                switch(this.currentFilter) {
                    case 'recent':
                        return this.notes.filter(note => new Date(note.created_at) > weekAgo);
                    case 'favorites':
                        return this.notes.filter(note => note.is_favorite);
                    default:
                        return this.notes;
                }
            }
            
            renderNotes(notesToRender = null) {
                const notes = notesToRender || this.getFilteredNotes();
                const grid = document.getElementById('notesGrid');
                const emptyState = document.getElementById('emptyState');
                
                if (notes.length === 0) {
                    grid.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }
                
                grid.style.display = 'grid';
                emptyState.style.display = 'none';
                
                grid.innerHTML = notes.map(note => this.createNoteHTML(note)).join('');
            }
            
            createNoteHTML(note) {
                const createdDate = new Date(note.created_at).toLocaleDateString();
                const updatedDate = new Date(note.updated_at).toLocaleDateString();
                const isUpdated = note.created_at !== note.updated_at;
                
                return `
                    <div class="note-card fade-in" data-id="${note.id}">
                        <div class="note-header">
                            <div>
                                <div class="note-title">${this.escapeHtml(note.title)}</div>
                                <div class="note-date">
                                    Created: ${createdDate}
                                    ${isUpdated ? ` • Updated: ${updatedDate}` : ''}
                                </div>
                            </div>
                            <button class="btn btn-small ${note.is_favorite ? 'btn-danger' : 'btn-secondary'}" 
                                    onclick="notesApp.toggleFavorite('${note.id}')">
                                ${note.is_favorite ? '❤️' : '🤍'}
                            </button>
                        </div>
                        <div class="note-content">${this.escapeHtml(note.content)}</div>
                        <div class="note-actions">
                            <button class="btn btn-small btn-primary" onclick="notesApp.editNote('${note.id}')">
                                ✏️ Edit
                            </button>
                            <button class="btn btn-small btn-danger" onclick="notesApp.confirmDeleteNote('${note.id}')">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                `;
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            updateStats() {
                const totalNotes = this.notes.length;
                const now = new Date();
                const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                const recentNotes = this.notes.filter(note => new Date(note.created_at) > weekAgo).length;
                const totalWords = this.notes.reduce((sum, note) => 
                    sum + note.title.split(' ').length + note.content.split(' ').length, 0);
                
                document.getElementById('totalNotes').textContent = totalNotes;
                document.getElementById('recentNotes').textContent = recentNotes;
                document.getElementById('totalWords').textContent = totalWords;
            }
            
            updateStatusIndicator() {
                const statusElement = document.getElementById('statusIndicator');
                if (this.useLocalStorage) {
                    statusElement.innerHTML = '📱 Using local storage (Supabase not configured)';
                    statusElement.style.color = '#ffa500';
                } else {
                    statusElement.innerHTML = '🗄️ Connected to Supabase database';
                    statusElement.style.color = '#51cf66';
                }
            }
            
            openCreateModal() {
                this.editingNoteId = null;
                document.getElementById('modalTitle').textContent = 'Create New Note';
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('saveBtn').textContent = 'Save Note';
                document.getElementById('noteModal').style.display = 'block';
                document.getElementById('noteTitle').focus();
            }
            
            editNote(id) {
                const note = this.notes.find(note => note.id === id);
                if (note) {
                    this.editingNoteId = id;
                    document.getElementById('modalTitle').textContent = 'Edit Note';
                    document.getElementById('noteTitle').value = note.title;
                    document.getElementById('noteContent').value = note.content;
                    document.getElementById('saveBtn').textContent = 'Update Note';
                    document.getElementById('noteModal').style.display = 'block';
                    document.getElementById('noteTitle').focus();
                }
            }
            
            async saveNote() {
                const title = document.getElementById('noteTitle').value;
                const content = document.getElementById('noteContent').value;
                
                if (!title.trim() || !content.trim()) {
                    alert('Please fill in both title and content!');
                    return;
                }
                
                if (this.editingNoteId) {
                    await this.updateNote(this.editingNoteId, title, content);
                } else {
                    await this.createNote(title, content);
                }
                
                this.closeModal();
                this.renderNotes();
            }
            
            async confirmDeleteNote(id) {
                if (confirm('Are you sure you want to delete this note?')) {
                    await this.deleteNote(id);
                    this.renderNotes();
                }
            }
            
            closeModal() {
                document.getElementById('noteModal').style.display = 'none';
                this.editingNoteId = null;
            }
            
            async clearAllNotes() {
                if (confirm('Are you sure you want to delete ALL notes? This action cannot be undone!')) {
                    try {
                        const { error } = await supabaseClient
                            .from('notes')
                            .delete()
                            .eq('user_id', this.user.id);
                        
                        if (error) throw error;
                        
                        this.notes = [];
                        this.updateStats();
                        this.renderNotes();
                        alert('All notes deleted successfully!');
                    } catch (error) {
                        console.error('Error clearing notes:', error);
                        alert('Failed to clear notes. Please try again.');
                    }
                }
            }
            
            exportNotes() {
                const dataStr = JSON.stringify(this.notes, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `notes-export-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            }
            
            importNotes() {
                document.getElementById('importFile').click();
            }
            
            handleFileImport(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedNotes = JSON.parse(e.target.result);
                        if (Array.isArray(importedNotes)) {
                            if (confirm(`Import ${importedNotes.length} notes? This will add them to your existing notes.`)) {
                                importedNotes.forEach(note => {
                                    note.id = this.generateId(); // Generate new IDs
                                    note.createdAt = new Date().toISOString();
                                    note.updatedAt = new Date().toISOString();
                                });
                                this.notes = [...importedNotes, ...this.notes];
                                this.saveNotes();
                                this.renderNotes();
                                alert('Notes imported successfully!');
                            }
                        } else {
                            alert('Invalid file format!');
                        }
                    } catch (error) {
                        alert('Error reading file!');
                    }
                };
                reader.readAsText(file);
            }
        }
        
        // Global functions for HTML onclick handlers
        function openCreateModal() {
            notesApp.openCreateModal();
        }
        
        function closeModal() {
            notesApp.closeModal();
        }
        
        function exportNotes() {
            notesApp.exportNotes();
        }
        
        function importNotes() {
            notesApp.importNotes();
        }
        
        function clearAllNotes() {
            notesApp.clearAllNotes();
        }
        
        function handleFileImport(event) {
            notesApp.handleFileImport(event);
        }
        
        // Initialize the app
        const notesApp = new NotesApp();
    </script>
</body>
</html>
