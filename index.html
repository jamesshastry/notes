<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Notes App</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .main-content {
            padding: 30px;
        }
        
        .search-bar {
            margin-bottom: 30px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 1rem;
            background: white;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .note-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }
        
        .note-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
            word-break: break-word;
        }
        
        .note-date {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 15px;
        }
        
        .note-content {
            color: #495057;
            line-height: 1.6;
            margin-bottom: 15px;
            word-break: break-word;
        }
        
        .note-actions {
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .note-card:hover .note-actions {
            opacity: 1;
        }
        
        .btn-small {
            padding: 8px 12px;
            font-size: 0.9rem;
            border-radius: 15px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6c757d;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: #f8f9fa;
            color: #495057;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .file-upload-section {
            border: 2px dashed #e1e5e9;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .file-upload-section:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .file-preview {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .file-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 200px;
            position: relative;
        }
        
        .file-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
        
        .file-info {
            flex: 1;
            min-width: 0;
        }
        
        .file-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #495057;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-size {
            font-size: 0.8rem;
            color: #6c757d;
        }
        
        .file-remove {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .file-remove:hover {
            background: #c82333;
        }
        
        .attachment-display {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .attachment-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 200px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .attachment-item:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        
        .attachment-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
        
        .attachment-info {
            flex: 1;
            min-width: 0;
        }
        
        .attachment-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #495057;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .attachment-size {
            font-size: 0.8rem;
            color: #6c757d;
        }
        
        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #495057;
        }
        
        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .notes-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                justify-content: center;
            }
            
            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Authentication Modal -->
    <div id="authModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 20000;">
        <div style="background: white; padding: 40px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%;">
            <h2 style="margin-bottom: 20px; color: #333;">🔐 Sign In Required</h2>
            <p style="margin-bottom: 30px; color: #666;">Please sign in with Google to access your notes</p>
            <button id="googleSignInBtn" style="background: #4285f4; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto; gap: 10px;">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            <div id="authError" style="margin-top: 20px; color: #e74c3c; display: none;"></div>
        </div>
    </div>

    <!-- User Info Bar -->
    <div id="userInfoBar" style="background: #2c3e50; color: white; padding: 10px 20px; display: none; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img id="userAvatar" src="" alt="User Avatar" style="width: 32px; height: 32px; border-radius: 50%;">
            <span id="userName">User Name</span>
        </div>
        <button id="signOutBtn" style="background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer;">Sign Out</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>📝 Notes App</h1>
            <p>Simple note-taking with Google authentication</p>
        </div>
        
        <div class="main-content">
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search your notes...">
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" onclick="openCreateModal()">
                    ➕ Create New Note
                </button>
                <button class="btn btn-danger" onclick="clearAllNotes()">
                    🗑️ Clear All
                </button>
            </div>
            
            <div class="notes-grid" id="notesGrid">
                <!-- Notes will be dynamically inserted here -->
            </div>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">📝</div>
                <h3>No notes found</h3>
                <p>Start by creating your first note!</p>
                <button class="btn btn-primary" onclick="openCreateModal()">
                    ➕ Create Your First Note
                </button>
            </div>
        </div>
    </div>
    
    <!-- Create/Edit Note Modal -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Create New Note</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="noteForm">
                <div class="form-group">
                    <label class="form-label" for="noteTitle">Title</label>
                    <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title..." required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="noteContent">Content</label>
                    <textarea class="form-input form-textarea" id="noteContent" placeholder="Write your note content here..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Attachments</label>
                    <div class="file-upload-section">
                        <input type="file" id="fileUpload" multiple accept="image/*,video/*,application/pdf,.doc,.docx,.txt,.zip,.rar" style="display: none;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('fileUpload').click()">
                            📎 Upload Files
                        </button>
                        <div id="filePreview" class="file-preview"></div>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Note</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Firebase Configuration -->
    <script>
        // Firebase Configuration - reads from environment variables
        const FIREBASE_CONFIG = {
            apiKey: 'your-firebase-api-key',
            authDomain: 'your-project-id.firebaseapp.com',
            projectId: 'your-project-id',
            storageBucket: 'your-project-id.appspot.com',
            messagingSenderId: 'your-sender-id',
            appId: 'your-app-id'
        };
        
        // Initialize Firebase
        firebase.initializeApp(FIREBASE_CONFIG);
        const auth = firebase.auth();
        
        // Supabase Configuration - reads from environment variables
        const SUPABASE_URL = 'https://your-project-id.supabase.co';
        const SUPABASE_ANON_KEY = 'your-anon-key-here';
        
        // Initialize Supabase client
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Debug logging for configuration
        console.log('🔧 Configuration Status:');
        console.log('🔥 Firebase API Key:', FIREBASE_CONFIG.apiKey !== 'your-firebase-api-key' ? 'SET' : 'NOT SET');
        console.log('🔥 Firebase Auth Domain:', FIREBASE_CONFIG.authDomain !== 'your-project-id.firebaseapp.com' ? 'SET' : 'NOT SET');
        console.log('🔥 Firebase Project ID:', FIREBASE_CONFIG.projectId !== 'your-project-id' ? 'SET' : 'NOT SET');
        console.log('🔗 Supabase URL:', SUPABASE_URL !== 'https://your-project-id.supabase.co' ? 'SET' : 'NOT SET');
        console.log('🔑 Supabase Key:', SUPABASE_ANON_KEY !== 'your-anon-key-here' ? 'SET' : 'NOT SET');
        
        // Authentication state
        let currentUser = null;
        let isAuthenticated = false;
        
        // Authentication functions
        function showAuthModal() {
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('userInfoBar').style.display = 'none';
            document.querySelector('.container').style.display = 'none';
        }
        
        function hideAuthModal() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('userInfoBar').style.display = 'flex';
            document.querySelector('.container').style.display = 'block';
        }
        
        function showAuthError(message) {
            const errorDiv = document.getElementById('authError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideAuthError() {
            document.getElementById('authError').style.display = 'none';
        }
        
        function updateUserInfo(user) {
            document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/32';
            document.getElementById('userName').textContent = user.displayName || user.email;
        }
        
        // Google Sign-In
        function signInWithGoogle() {
            hideAuthError();
            console.log('🔐 Starting Google Sign-In...');
            console.log('🔥 Firebase config:', FIREBASE_CONFIG);
            
            const provider = new firebase.auth.GoogleAuthProvider();
            
            auth.signInWithPopup(provider)
                .then((result) => {
                    console.log('✅ Google Sign-In successful:', result.user);
                    console.log('👤 User UID:', result.user.uid);
                    console.log('📧 User email:', result.user.email);
                    currentUser = result.user;
                    isAuthenticated = true;
                    hideAuthModal();
                    updateUserInfo(result.user);
                    
                    // Initialize notes app after authentication
                    if (window.notesApp) {
                        window.notesApp.user = {
                            id: result.user.uid,
                            email: result.user.email,
                            name: result.user.displayName
                        };
                        window.notesApp.init();
                    }
                })
                .catch((error) => {
                    console.error('❌ Google Sign-In failed:', error);
                    console.error('❌ Error code:', error.code);
                    console.error('❌ Error message:', error.message);
                    console.error('❌ Error details:', JSON.stringify(error, null, 2));
                    showAuthError(`Sign-in failed: ${error.message}`);
                });
        }
        
        // Sign Out
        function signOut() {
            auth.signOut()
                .then(() => {
                    console.log('✅ Sign-out successful');
                    currentUser = null;
                    isAuthenticated = false;
                    showAuthModal();
                    
                    // Clear notes app
                    if (window.notesApp) {
                        window.notesApp.notes = [];
                        window.notesApp.renderNotes();
                    }
                })
                .catch((error) => {
                    console.error('❌ Sign-out failed:', error);
                });
        }
        
        // Auth state listener
        auth.onAuthStateChanged((user) => {
            console.log('🔥 Auth state changed:', user ? 'User authenticated' : 'User not authenticated');
            
            if (user) {
                console.log('🔥 User authenticated:', user.email);
                console.log('👤 User UID:', user.uid);
                console.log('📧 User email:', user.email);
                console.log('👤 User display name:', user.displayName);
                currentUser = user;
                isAuthenticated = true;
                hideAuthModal();
                updateUserInfo(user);
                
                // Initialize notes app with Firebase user
                if (window.notesApp) {
                    window.notesApp.user = {
                        id: user.uid,
                        email: user.email,
                        name: user.displayName
                    };
                    window.notesApp.init();
                }
            } else {
                console.log('🔥 User not authenticated');
                currentUser = null;
                isAuthenticated = false;
                showAuthModal();
                
                // Reset notes app
                if (window.notesApp) {
                    window.notesApp.notes = [];
                    window.notesApp.user = null;
                    window.notesApp.isInitialized = false;
                    window.notesApp.renderNotes();
                }
            }
        });
        
        // Event listeners
        document.getElementById('googleSignInBtn').addEventListener('click', signInWithGoogle);
        document.getElementById('signOutBtn').addEventListener('click', signOut);
    </script>
    
    <script>
        class NotesApp {
            constructor() {
                this.notes = [];
                this.editingNoteId = null;
                this.user = null;
                this.isInitialized = false;
                this.selectedFiles = []; // Store selected files for upload
                
                // Make app globally accessible
                window.notesApp = this;
                
                console.log('📝 NotesApp created, waiting for Firebase authentication...');
            }
            
            async init() {
                if (this.isInitialized) {
                    console.log('📝 NotesApp already initialized');
                    return;
                }
                
                console.log('📝 Initializing NotesApp with Firebase user:', this.user);
                
                await this.loadNotes();
                this.renderNotes();
                this.bindEvents();
                
                this.isInitialized = true;
                console.log('✅ NotesApp initialized successfully');
            }
            
            bindEvents() {
                // Search functionality
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchNotes(e.target.value);
                });
                
                // Form submission
                document.getElementById('noteForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveNote();
                });
                
                // File upload
                document.getElementById('fileUpload').addEventListener('change', (e) => {
                    this.handleFileSelection(e.target.files);
                });
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'n': e.preventDefault(); this.openCreateModal(); break;
                            case 'f': e.preventDefault(); document.getElementById('searchInput').focus(); break;
                        }
                    }
                    if (e.key === 'Escape') {
                        this.closeModal();
                    }
                });
            }
            
            async loadNotes() {
                try {
                    console.log('📚 Loading notes for user:', this.user.id);
                    console.log('🔗 Supabase URL:', SUPABASE_URL);
                    console.log('🔑 Supabase Key:', SUPABASE_ANON_KEY ? 'SET' : 'NOT SET');
                    
                    const { data, error } = await supabaseClient
                        .from('notes')
                        .select('*')
                        .eq('user_id', this.user.id)
                        .order('created_at', { ascending: false });
                    
                    if (error) {
                        console.error('❌ Supabase error:', error);
                        console.error('❌ Error details:', JSON.stringify(error, null, 2));
                        throw error;
                    }
                    
                    this.notes = data || [];
                    console.log('✅ Notes loaded from Supabase:', this.notes.length);
                    console.log('📊 Notes data:', this.notes);
                } catch (error) {
                    console.error('❌ Error loading notes:', error);
                    console.error('❌ Error stack:', error.stack);
                    this.notes = [];
                    alert('Failed to load notes from Supabase. Please check your configuration.');
                }
            }
            
            async createNote(title, content, attachments = []) {
                try {
                    console.log('📝 Creating note with title:', title);
                    console.log('👤 User ID:', this.user.id);
                    console.log('🔗 Supabase URL:', SUPABASE_URL);
                    console.log('🔑 Supabase Key:', SUPABASE_ANON_KEY ? 'SET' : 'NOT SET');
                    console.log('📎 Attachments:', attachments);
                    
                    const noteData = {
                        title: title.trim(),
                        content: content.trim(),
                        user_id: this.user.id,
                        is_favorite: false,
                        tags: [],
                        attachments: attachments
                    };
                    
                    console.log('📊 Inserting data:', noteData);
                    
                    const { data, error } = await supabaseClient
                        .from('notes')
                        .insert([noteData])
                        .select()
                        .single();
                    
                    if (error) {
                        console.error('❌ Supabase error:', error);
                        console.error('❌ Error details:', JSON.stringify(error, null, 2));
                        throw error;
                    }
                    
                    console.log('✅ Note created successfully in Supabase:', data);
                    this.notes.unshift(data);
                    return data;
                } catch (error) {
                    console.error('❌ Error creating note:', error);
                    console.error('❌ Error stack:', error.stack);
                    alert('Failed to create note in Supabase. Please check your configuration.');
                    throw error;
                }
            }
            
            async updateNote(id, title, content, attachments = null) {
                try {
                    console.log('✏️ Updating note:', id);
                    console.log('📝 New title:', title);
                    console.log('👤 User ID:', this.user.id);
                    console.log('📎 Attachments:', attachments);
                    
                    const updateData = {
                        title: title.trim(),
                        content: content.trim()
                    };
                    
                    // Only update attachments if provided
                    if (attachments !== null) {
                        updateData.attachments = attachments;
                    }
                    
                    console.log('📊 Update data:', updateData);
                    
                    const { data, error } = await supabaseClient
                        .from('notes')
                        .update(updateData)
                        .eq('id', id)
                        .eq('user_id', this.user.id)
                        .select()
                        .single();
                    
                    if (error) {
                        console.error('❌ Supabase update error:', error);
                        console.error('❌ Error details:', JSON.stringify(error, null, 2));
                        throw error;
                    }
                    
                    console.log('✅ Note updated successfully:', data);
                    
                    const noteIndex = this.notes.findIndex(note => note.id === id);
                    if (noteIndex !== -1) {
                        this.notes[noteIndex] = data;
                    }
                    
                    return data;
                } catch (error) {
                    console.error('❌ Error updating note:', error);
                    console.error('❌ Error stack:', error.stack);
                    alert('Failed to update note in Supabase. Please check your configuration.');
                    throw error;
                }
            }
            
            async deleteNote(id) {
                try {
                    console.log('🗑️ Deleting note:', id);
                    console.log('👤 User ID:', this.user.id);
                    console.log('📊 Notes count before deletion:', this.notes.length);
                    
                    // Find the note to get attachments
                    const note = this.notes.find(note => note.id === id);
                    if (note && note.attachments && note.attachments.length > 0) {
                        console.log('📎 Deleting associated files:', note.attachments);
                        for (const attachment of note.attachments) {
                            try {
                                await this.deleteFile(attachment.path);
                            } catch (fileError) {
                                console.error('❌ Error deleting file:', attachment.path, fileError);
                                // Continue with note deletion even if file deletion fails
                            }
                        }
                    }
                    
                    const { error } = await supabaseClient
                        .from('notes')
                        .delete()
                        .eq('id', id)
                        .eq('user_id', this.user.id);
                    
                    if (error) {
                        console.error('❌ Supabase delete error:', error);
                        console.error('❌ Error details:', JSON.stringify(error, null, 2));
                        throw error;
                    }
                    
                    console.log('✅ Note deleted successfully from database');
                    
                    // Update the notes array
                    const initialLength = this.notes.length;
                    this.notes = this.notes.filter(note => note.id !== id);
                    const finalLength = this.notes.length;
                    
                    console.log('📊 Notes array updated:', {
                        initialLength,
                        finalLength,
                        deleted: initialLength - finalLength
                    });
                    
                    if (initialLength === finalLength) {
                        console.warn('⚠️ Note was not found in local array, this might indicate a sync issue');
                    }
                    
                } catch (error) {
                    console.error('❌ Error deleting note:', error);
                    console.error('❌ Error stack:', error.stack);
                    alert('Failed to delete note from Supabase. Please check your configuration.');
                    throw error;
                }
            }
            
            searchNotes(query) {
                const filteredNotes = this.notes.filter(note => 
                    note.title.toLowerCase().includes(query.toLowerCase()) ||
                    note.content.toLowerCase().includes(query.toLowerCase())
                );
                this.renderNotes(filteredNotes);
            }
            
            renderNotes(notesToRender = null) {
                const notes = notesToRender || this.notes;
                const grid = document.getElementById('notesGrid');
                const emptyState = document.getElementById('emptyState');
                
                console.log('🔄 Rendering notes:', {
                    notesCount: notes.length,
                    notesToRender: notesToRender ? 'filtered' : 'all',
                    notes: notes.map(note => ({ id: note.id, title: note.title }))
                });
                
                if (notes.length === 0) {
                    console.log('📭 No notes to display, showing empty state');
                    grid.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }
                
                console.log('📝 Rendering', notes.length, 'notes');
                grid.style.display = 'grid';
                emptyState.style.display = 'none';
                
                grid.innerHTML = notes.map(note => this.createNoteHTML(note)).join('');
                console.log('✅ Notes rendered successfully');
            }
            
            createNoteHTML(note) {
                const createdDate = new Date(note.created_at).toLocaleDateString();
                const updatedDate = new Date(note.updated_at).toLocaleDateString();
                const isUpdated = note.created_at !== note.updated_at;
                
                return `
                    <div class="note-card fade-in" data-id="${note.id}">
                        <div class="note-title">${this.escapeHtml(note.title)}</div>
                        <div class="note-date">
                            Created: ${createdDate}
                            ${isUpdated ? ` • Updated: ${updatedDate}` : ''}
                        </div>
                        <div class="note-content">${this.escapeHtml(note.content)}</div>
                        ${note.attachments && note.attachments.length > 0 ? `
                            <div class="attachment-display">
                                ${note.attachments.map(attachment => `
                                    <div class="attachment-item" onclick="notesApp.downloadFile('${attachment.path}', '${attachment.name}')">
                                        ${this.getFileIcon(attachment.type)}
                                        <div class="attachment-info">
                                            <div class="attachment-name">${this.escapeHtml(attachment.name)}</div>
                                            <div class="attachment-size">${this.formatFileSize(attachment.size)}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                        <div class="note-actions">
                            <button class="btn btn-small btn-primary" onclick="editNote('${note.id}')">
                                ✏️ Edit
                            </button>
                            <button class="btn btn-small btn-danger" onclick="confirmDeleteNote('${note.id}')">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                `;
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            getFileIcon(fileType) {
                if (fileType.startsWith('image/')) {
                    return '<img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iNCIgZmlsbD0iI0Y4RjlGQSIvPgo8cGF0aCBkPSJNMTIgMTZMMTYgMTJMMjAgMTZMMjggOEgzMlYzMkg4VjE2SDEyWiIgZmlsbD0iIzY2N0VBNiIvPgo8Y2lyY2xlIGN4PSIxNCIgY3k9IjE0IiByPSIyIiBmaWxsPSIjNjY3RUE2Ii8+Cjwvc3ZnPgo=" alt="Image" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;">';
                } else if (fileType.startsWith('video/')) {
                    return '<div style="width: 40px; height: 40px; background: #667eea; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;">🎥</div>';
                } else if (fileType === 'application/pdf') {
                    return '<div style="width: 40px; height: 40px; background: #dc3545; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;">📄</div>';
                } else if (fileType.includes('word') || fileType.includes('document')) {
                    return '<div style="width: 40px; height: 40px; background: #007bff; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;">📝</div>';
                } else if (fileType.includes('zip') || fileType.includes('rar')) {
                    return '<div style="width: 40px; height: 40px; background: #28a745; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;">📦</div>';
                } else {
                    return '<div style="width: 40px; height: 40px; background: #6c757d; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;">📎</div>';
                }
            }
            
            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            async uploadFile(file) {
                try {
                    console.log('📎 Uploading file:', file.name);
                    console.log('📊 File size:', file.size);
                    console.log('📄 File type:', file.type);
                    
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
                    const filePath = `notes/${this.user.id}/${fileName}`;
                    
                    console.log('📁 File path:', filePath);
                    
                    const { data, error } = await supabaseClient.storage
                        .from('note-attachments')
                        .upload(filePath, file);
                    
                    if (error) {
                        console.error('❌ File upload error:', error);
                        throw error;
                    }
                    
                    console.log('✅ File uploaded successfully:', data);
                    
                    return {
                        name: file.name,
                        path: data.path,
                        size: file.size,
                        type: file.type,
                        url: data.path
                    };
                } catch (error) {
                    console.error('❌ Error uploading file:', error);
                    throw error;
                }
            }
            
            async downloadFile(filePath, fileName) {
                try {
                    console.log('⬇️ Downloading file:', fileName);
                    console.log('📁 File path:', filePath);
                    
                    const { data, error } = await supabaseClient.storage
                        .from('note-attachments')
                        .download(filePath);
                    
                    if (error) {
                        console.error('❌ File download error:', error);
                        throw error;
                    }
                    
                    // Create download link
                    const url = URL.createObjectURL(data);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName;
                    link.click();
                    URL.revokeObjectURL(url);
                    
                    console.log('✅ File downloaded successfully:', fileName);
                } catch (error) {
                    console.error('❌ Error downloading file:', error);
                    alert('Failed to download file. Please try again.');
                }
            }
            
            async deleteFile(filePath) {
                try {
                    console.log('🗑️ Deleting file:', filePath);
                    
                    const { error } = await supabaseClient.storage
                        .from('note-attachments')
                        .remove([filePath]);
                    
                    if (error) {
                        console.error('❌ File deletion error:', error);
                        throw error;
                    }
                    
                    console.log('✅ File deleted successfully:', filePath);
                } catch (error) {
                    console.error('❌ Error deleting file:', error);
                    throw error;
                }
            }
            
            handleFileSelection(files) {
                console.log('📎 Files selected:', files.length);
                
                // Add files to selected files array
                Array.from(files).forEach(file => {
                    this.selectedFiles.push(file);
                });
                
                this.updateFilePreview();
            }
            
            updateFilePreview() {
                const preview = document.getElementById('filePreview');
                preview.innerHTML = '';
                
                this.selectedFiles.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    const isImage = file.type.startsWith('image/');
                    const iconHtml = isImage ? 
                        `<img src="${URL.createObjectURL(file)}" alt="${file.name}">` :
                        this.getFileIcon(file.type);
                    
                    fileItem.innerHTML = `
                        ${iconHtml}
                        <div class="file-info">
                            <div class="file-name">${this.escapeHtml(file.name)}</div>
                            <div class="file-size">${this.formatFileSize(file.size)}</div>
                        </div>
                        <button class="file-remove" onclick="notesApp.removeFile(${index})">×</button>
                    `;
                    
                    preview.appendChild(fileItem);
                });
            }
            
            removeFile(index) {
                this.selectedFiles.splice(index, 1);
                this.updateFilePreview();
            }
            
            openCreateModal() {
                this.editingNoteId = null;
                this.selectedFiles = []; // Reset selected files
                document.getElementById('modalTitle').textContent = 'Create New Note';
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('saveBtn').textContent = 'Save Note';
                document.getElementById('filePreview').innerHTML = '';
                document.getElementById('fileUpload').value = '';
                document.getElementById('noteModal').style.display = 'block';
                document.getElementById('noteTitle').focus();
            }
            
            editNote(id) {
                try {
                    console.log('✏️ Edit note clicked for ID:', id);
                    console.log('📊 Available notes:', this.notes.map(note => ({ id: note.id, title: note.title })));
                    
                    const note = this.notes.find(note => note.id === id);
                    console.log('🔍 Found note:', note);
                    
                    if (note) {
                        console.log('✅ Opening edit modal for note:', note.title);
                        this.editingNoteId = id;
                        this.selectedFiles = []; // Reset selected files for editing
                        
                        // Update modal content
                        document.getElementById('modalTitle').textContent = 'Edit Note';
                        document.getElementById('noteTitle').value = note.title;
                        document.getElementById('noteContent').value = note.content;
                        document.getElementById('saveBtn').textContent = 'Update Note';
                        document.getElementById('filePreview').innerHTML = '';
                        document.getElementById('fileUpload').value = '';
                        
                        // Show modal
                        const modal = document.getElementById('noteModal');
                        console.log('📱 Modal element:', modal);
                        modal.style.display = 'block';
                        console.log('✅ Modal displayed');
                        
                        // Focus on title field
                        document.getElementById('noteTitle').focus();
                        console.log('✅ Edit modal opened successfully');
                    } else {
                        console.error('❌ Note not found with ID:', id);
                        alert('Note not found. Please refresh the page and try again.');
                    }
                } catch (error) {
                    console.error('❌ Error in editNote:', error);
                    console.error('❌ Error stack:', error.stack);
                    alert('Failed to open edit modal. Please try again.');
                }
            }
            
            async saveNote() {
                const title = document.getElementById('noteTitle').value;
                const content = document.getElementById('noteContent').value;
                
                if (!title.trim() || !content.trim()) {
                    alert('Please fill in both title and content!');
                    return;
                }
                
                try {
                    // Upload files first if any are selected
                    let attachments = [];
                    if (this.selectedFiles.length > 0) {
                        console.log('📎 Uploading files...');
                        for (const file of this.selectedFiles) {
                            const attachment = await this.uploadFile(file);
                            attachments.push(attachment);
                        }
                        console.log('✅ Files uploaded:', attachments);
                    }
                    
                    if (this.editingNoteId) {
                        // For editing, merge with existing attachments
                        const existingNote = this.notes.find(note => note.id === this.editingNoteId);
                        const existingAttachments = existingNote.attachments || [];
                        attachments = [...existingAttachments, ...attachments];
                        await this.updateNote(this.editingNoteId, title, content, attachments);
                    } else {
                        await this.createNote(title, content, attachments);
                    }
                    
                    this.closeModal();
                    this.renderNotes();
                } catch (error) {
                    console.error('❌ Error saving note:', error);
                    alert('Failed to save note. Please try again.');
                }
            }
            
            async confirmDeleteNote(id) {
                if (confirm('Are you sure you want to delete this note?')) {
                    try {
                        console.log('🗑️ Starting note deletion process for ID:', id);
                        await this.deleteNote(id);
                        console.log('✅ Note deletion completed, refreshing view');
                        this.renderNotes();
                        this.updateStats(); // Also update stats after deletion
                        
                        // Force refresh from database to ensure sync
                        console.log('🔄 Force refreshing notes from database');
                        await this.loadNotes();
                        this.renderNotes();
                        this.updateStats();
                    } catch (error) {
                        console.error('❌ Error in confirmDeleteNote:', error);
                        alert('Failed to delete note. Please try again.');
                    }
                }
            }
            
            closeModal() {
                document.getElementById('noteModal').style.display = 'none';
                this.editingNoteId = null;
            }
            
            async clearAllNotes() {
                if (confirm('Are you sure you want to delete ALL notes? This action cannot be undone!')) {
                    try {
                        const { error } = await supabaseClient
                            .from('notes')
                            .delete()
                            .eq('user_id', this.user.id);
                        
                        if (error) throw error;
                        
                        this.notes = [];
                        this.renderNotes();
                        alert('All notes deleted successfully!');
                    } catch (error) {
                        console.error('Error clearing notes:', error);
                        alert('Failed to clear notes. Please try again.');
                    }
                }
            }
        }
        
        // Initialize the app first
        const notesApp = new NotesApp();
        
        // Global functions for HTML onclick handlers
        function openCreateModal() {
            notesApp.openCreateModal();
        }
        
        function closeModal() {
            notesApp.closeModal();
        }
        
        function clearAllNotes() {
            notesApp.clearAllNotes();
        }
        
        function removeFile(index) {
            notesApp.removeFile(index);
        }
        
        function editNote(id) {
            console.log('🌐 Global editNote called with ID:', id);
            if (notesApp) {
                notesApp.editNote(id);
            } else {
                console.error('❌ notesApp not available');
                alert('Application not ready. Please refresh the page.');
            }
        }
        
        function confirmDeleteNote(id) {
            console.log('🌐 Global confirmDeleteNote called with ID:', id);
            if (notesApp) {
                notesApp.confirmDeleteNote(id);
            } else {
                console.error('❌ notesApp not available');
                alert('Application not ready. Please refresh the page.');
            }
        }
    </script>
</body>
</html>
